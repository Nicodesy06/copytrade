[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m4-copydesk"
version = "0.1.0"
description = "M4 CopyDesk: sistema locale multi-agente di ricerca copy-trading Solana (solo PAPER)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27,<1",
  "websockets>=13",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "SQLAlchemy>=2.0,<3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "Jinja2>=3.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
m4desk = "m4desk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
m4desk = ["web/templates/*.html", "web/static/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "S311", "B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"src/m4desk/types.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["m4desk", "helpers"]
