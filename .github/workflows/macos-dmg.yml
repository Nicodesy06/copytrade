name: macOS DMG

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    # Apple Silicon (arm64), come il Mac mini M4. Gratuito per repository pubblici.
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test e lint
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -q -e '.[dev]'
          .venv/bin/pytest -q
          .venv/bin/ruff check .

      - name: Prova Portachiavi macOS (chiave usa-e-getta, nessun fondo)
        continue-on-error: true
        run: |
          .venv/bin/python - <<'PY'
          from solders.keypair import Keypair
          from m4desk.live.keystore import KeyStore, _b58encode
          ks = KeyStore()
          print("backend:", ks.available())
          kp = Keypair()
          assert ks.store(_b58encode(bytes(kp))) == str(kp.pubkey())
          assert ks.pubkey() == str(kp.pubkey())
          ks.forget()
          assert not ks.has_key()
          print("Portachiavi macOS: OK")
          PY

      - name: Compila app e DMG
        run: PYTHON=python packaging/build_macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: M4-CopyDesk-macOS-arm64
          path: |
            build/*.dmg
            build/*.dmg.sha256
          if-no-files-found: error

      - name: Pubblica release (solo tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.dmg
            build/*.dmg.sha256
